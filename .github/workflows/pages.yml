name: Deploy Ponder Source app
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    # Retain the original environment context for the public OSM client variable.
    environment: github-pages
    if: github.repository == 'pondersource/marco'
    runs-on: ubuntu-24.04
    outputs:
      pages_artifact: ${{ steps.pages_artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm exec vite build --outDir "$RUNNER_TEMP/marco-pages"
        env:
          VITE_OSM_CLIENT_ID: ${{ vars.MARCO_OSM_CLIENT_ID }}
      - uses: actions/checkout@v4
        with:
          repository: pondersource/remotestorage.js
          ref: 607acc5a474c28e08ca3836de71d20c9bdff7ca1
          path: atomic-storage-source
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: ontola/atomic-server
          ref: fb640fb54657ef826db8ec7ca55e24587faab1da
          path: atomic-sdk-source
          persist-credentials: false

      - run: pnpm install --frozen-lockfile && pnpm --filter @tomic/utils build
        working-directory: atomic-sdk-source/browser

      - run: node atomic-storage-source/scripts/build-atomic-sdk.mjs atomic-sdk-source "$RUNNER_TEMP/marco-pages"/atomic-sdk

      - name: Prepare custom domain and client routes
        run: |
          cp -R atomic "$RUNNER_TEMP/marco-pages/"
          cd "$RUNNER_TEMP/marco-pages"
          printf '%s\n' 'marco.pondersource.com' > CNAME
          cp index.html 404.html
          touch .nojekyll
      - name: Select the Pages artifact for this attempt
        id: pages_artifact
        run: echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ steps.pages_artifact.outputs.name }}
          path: ${{ runner.temp }}/marco-pages
  deploy:
    if: github.event_name != 'pull_request'
    if: github.repository == 'pondersource/marco'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: ${{ needs.build.outputs.pages_artifact }}
