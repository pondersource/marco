name: Deploy Ponder Source app
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'pondersource/marco'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm exec vite build --outDir "$RUNNER_TEMP/marco-pages"
        env:
          VITE_OSM_CLIENT_ID: ${{ vars.MARCO_OSM_CLIENT_ID }}
      - name: Prepare custom domain and client routes
        run: |
          cd "$RUNNER_TEMP/marco-pages"
          printf '%s\n' 'marco.pondersource.com' > CNAME
          cp index.html 404.html
          touch .nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/marco-pages
      - uses: actions/deploy-pages@v4
        id: deployment
