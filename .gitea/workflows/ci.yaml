name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request: {}

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: builtin:checkout
      - uses: pnpm/action-setup@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Get pnpm cache paths
        id: pnpm-cache
        shell: bash
        run: |
          echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          echo "cache=$(pnpm cache path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store and metadata
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.pnpm-cache.outputs.store }}
            ${{ steps.pnpm-cache.outputs.cache }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint

  test:
    name: "Test"
    runs-on: ubuntu-latest
    container:
      image: cypress/browsers:node-22.19.0-chrome-139.0.7258.154-1-ff-142.0.1-edge-139.0.3405.125-1
    timeout-minutes: 10

    steps:
      - uses: builtin:checkout
      - uses: pnpm/action-setup@v4
      - name: Get pnpm cache paths
        id: pnpm-cache
        shell: bash
        run: |
          echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          echo "cache=$(pnpm cache path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store and metadata
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.pnpm-cache.outputs.store }}
            ${{ steps.pnpm-cache.outputs.cache }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Tests
        run: pnpm test
